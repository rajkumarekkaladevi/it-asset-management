<!DOCTYPE html>
<html>
<head>
    <title>IT Asset Management</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

body {
    font-family: Arial, sans-serif;
    margin: 20px;
}

h1 {
    color: #2c3e50;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
}

th {
    background: #3498db;
    color: white;
    padding: 10px;
}

tr:nth-child(even){
    background:#f2f2f2;
}

button{
    background:#28a745;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#218838;
}
.stats-container{
    display:flex;
    gap:20px;
    margin-bottom:20px;
    flex-wrap:wrap;
}
.stats{
    background:#3498db;
    color:white;
    padding:15px;
    width:200px;
    border-radius:8px;
    margin-bottom:20px;
}
.stats{
    background:#3498db;
    color:white;
    padding:15px;
    width:200px;
    border-radius:8px;
    margin-bottom:20px;
}

#searchBox{
    width:300px;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
    margin-bottom:20px;
}

h1{
    margin-bottom:20px;
}

table{
    margin-top:10px;
}

</style>
      
</head>
<body>

<h1>IT Asset Management Dashboard</h1>
<div class="stats-container">

<div class="stats">
    <h3>Total Assets</h3>
    <h2 id="totalAssets">0</h2>
</div>

<div class="stats">
    <h3>Laptops</h3>
    <h2 id="laptopCount">0</h2>
</div>

<div class="stats">
   <h3>Monitors</h3>
   <h2 id="monitorCount">0</h2>
</div>

<div class="stats">
   <h3>Warranty Expiring Soon</h3>
   <h2 id="expiryCount">0</h2>
</div>
</div>
<div style="margin:20px 0;">
    <input
        type="text"
        id="searchBox"
        placeholder="Search Asset Tag..."
        onkeyup="searchAsset()"
        style="width:300px; padding:10px;">
</div>
<br><br>
<table id="assetTable">
    <thead>
        <tr>
            <th>Asset Tag</th>
            <th>Type</th>
            <th>Brand</th>
            <th>Model</th>
            <th>Assigned To</th>
             <th>Actions</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<button onclick="exportAssets()">
    Export Assets
</button>

<script>
 function exportAssets() {
    window.open(
        'http://localhost:3000/export-assets',
        '_blank'
    );
}   
async function loadAssets() {

    const response = await fetch('http://localhost:3000/assets');
    const data = await response.json();

    document.getElementById('totalAssets').innerText = data.length;

    let laptops = data.filter(
        asset => asset.asset_type.toLowerCase() === "laptop"
    ).length;

     document.getElementById("laptopCount").innerText = laptops;
     let monitors = data.filter(
    asset => asset.asset_type.toLowerCase() === "monitor"
).length;

document.getElementById("monitorCount").innerText = monitors;
    let rows = '';

    data.forEach(asset => {

        rows += `
        <tr>
            <td>${asset.asset_tag}</td>
            <td>${asset.asset_type}</td>
            <td>${asset.brand}</td>
            <td>${asset.model}</td>
            <td>${asset.assigned_to}</td>
        <td>
            <button onclick="editAsset(${asset.id})">Edit</button>
            <button onclick="deleteAsset(${asset.id})">Delete</button>
        </td>    
        </tr>
        `;
    });

    document.querySelector('#assetTable tbody').innerHTML = rows;
}
async function deleteAsset(id) {

    if (!confirm("Delete this asset?")) return;

    await fetch(`http://localhost:3000/assets/${id}`, {
        method: 'DELETE'
    });

    loadAssets();
}
loadAssets();
function searchAsset() {

    let input = document.getElementById("searchBox").value.toUpperCase();

    let table = document.getElementById("assetTable");

    let tr = table.getElementsByTagName("tr");

    for (let i = 1; i < tr.length; i++) {

        let td = tr[i].getElementsByTagName("td")[0];

        if (td) {

            let txtValue = td.textContent || td.innerText;

            if (txtValue.toUpperCase().indexOf(input) > -1) {

                tr[i].style.display = "";

            } else {

                tr[i].style.display = "none";
            }
        }
    }
}
</script>
<button onclick="window.location.href='add-asset.html'">
Add New Asset
</button>

<br><br>

</body>
</html>
