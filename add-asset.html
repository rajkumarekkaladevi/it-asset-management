<!DOCTYPE html>
<html>
<head>
    <title>Add Asset</title>
</head>
<body>

<h1>Add New Asset</h1>

<form id="assetForm">

    Asset Tag:<br>
    <input type="text" id="asset_tag"><br><br>

    Asset Type:<br>
    <input type="text" id="asset_type"><br><br>

    Brand:<br>
    <input type="text" id="brand"><br><br>

    Model:<br>
    <input type="text" id="model"><br><br>

    Serial Number:<br>
    <input type="text" id="serial_number"><br><br>

    Purchase Date:<br>
    <input type="date" id="purchase_date"><br><br>

    Warranty End:<br>
    <input type="date" id="warranty_end"><br><br>

    Status:<br>
    <input type="text" id="status"><br><br>

    Assigned To:<br>
    <input type="text" id="assigned_to"><br><br>

    <button type="submit">Save Asset</button>

</form>

<script src="add-asset.js"></script>

</body>
</html>
